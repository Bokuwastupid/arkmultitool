services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kopt
      POSTGRES_USER: kopt
      POSTGRES_PASSWORD: ${KOPT_POSTGRES_PASSWORD:?set KOPT_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kopt -d kopt"]
      interval: 5s
      timeout: 3s
      retries: 20

  control-plane:
    build:
      context: ./Kopt.ControlPlane
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ControlPlane: Host=postgres;Port=5432;Database=kopt;Username=kopt;Password=${KOPT_POSTGRES_PASSWORD}
      Database__AutoMigrate: "true"
      Security__HashPepper: ${KOPT_HASH_PEPPER:?set KOPT_HASH_PEPPER}
      Security__CapabilityPrivateKeyPkcs8: ${KOPT_CAPABILITY_PRIVATE_KEY_PKCS8:?set KOPT_CAPABILITY_PRIVATE_KEY_PKCS8}
      KOPT_BOOTSTRAP_ADMIN_EMAIL: ${KOPT_BOOTSTRAP_ADMIN_EMAIL:?set KOPT_BOOTSTRAP_ADMIN_EMAIL}
      KOPT_BOOTSTRAP_ADMIN_PASSWORD: ${KOPT_BOOTSTRAP_ADMIN_PASSWORD:?set KOPT_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5087:8080"
    volumes:
      - data-protection:/app/data-protection

volumes:
  postgres-data:
  data-protection:
